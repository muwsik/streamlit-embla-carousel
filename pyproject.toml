[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "streamlit-embla-carousel"
version = "0.9.4"
description = "Interactive image gallery component for Streamlit based on Embla Carousel"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "Muwsik", email = "nanoweb.assist@gmail.com" }
]
dependencies = [
    "streamlit>=1.55"
]
classifiers = [
    "Programming Language :: Python :: 3",
]

[project.urls]
Repository = "https://github.com/Muwsik/streamlit-embla-carousel"

[project.optional-dependencies]
dev = [
    "wheel",
    "pytest==7.4.0",
    "playwright==1.48.0",
    "requests==2.31.0",
    "pytest-playwright-snapshot==1.0",
    "pytest-rerunfailures==12.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["streamlit_embla_carousel*"]

[tool.setuptools.package-data]
streamlit_embla_carousel = [
    "frontend/build/**/*",
    "pyproject.toml"
]